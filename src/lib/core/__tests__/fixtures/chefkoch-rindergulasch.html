<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Recipe","@id":"https://www.chefkoch.de/rezepte/2275401363075693/Rindergulasch.html#recipe","publisher":{"@id":"https://www.chefkoch.de/#organization"},"inLanguage":"de-DE","recipeCuisine":"Deutsch","recipeCategory":"Rind","author":{"@id":"https://www.chefkoch.de/user/profil/6fae2dd1184b83b33b59418840399495#author"},"contributor":{"@id":"https://www.chefkoch.de/user/profil/fb2becd9d76c4c5edf8393cf7620e1c8#author"},"name":"Rindergulasch, klassisch – saftig und zart","description":"Klassisches Rindergulasch Rezept – Saftiges Gulasch wie bei Oma einfach nachgemacht. Eines der beliebtesten Rezepte entdecken!","abstract":"Mit diesem Rezept gelingt dir Rindergulasch auf klassische Art und mit wenigen Handgriffen. Nach dem Gemüse schneiden, werden Fleisch und Gemüse angebraten, mit Rotwein und Brühe abgelöscht und anschließend lange bei geringer Hitze geschmort. So bekommst du ein Gulasch, wie es sein soll: mit würziger Sauce und zarten, mürben Fleischstücken. Das perfekte Schmorgericht zum Vorbereiten und ein Wohlfühlessen für kalte Tage.","award":"Chefkoch Top Rezept","mainEntityOfPage":{"@id":"https://www.chefkoch.de/rezepte/2275401363075693/Rindergulasch.html"},"alternativeHeadline":"Ein klassisches Rindergulasch mit würziger Sauce und zartem Fleisch.","image":{"@id":"https://www.chefkoch.de/rezepte/2275401363075693/Rindergulasch.html#primaryimage"},"prepTime":"PT20M","cookTime":"PT2H0M","totalTime":"PT2H20M","recipeYield":["4","4 Portionen"],"keywords":"Hauptspeise, Schmoren","datePublished":"2013-03-12","dateModified":"2026-09-06","recipeInstructions":[{"@type":"HowToSection","name":"Zubereitung","itemListElement":[{"@type":"HowToStep","position":1,"text":"In dem Butterschmalz das Rindergulasch scharf anbraten. Nachdem es rundum angebraten ist, Zwiebeln, Knoblauch und die in Scheiben geschnittenen Karotten beifügen. Danach Tomatenmark zugeben und ca. 3 Minuten köcheln (Hitze etwas reduzieren). Dann mit dem Rotwein ablöschen und anschließend die Rinderbrühe und die Gemüsebrühe zugeben und mit Salz, Pfeffer und Paprikapulver würzen. Zugedeckt bei geringer Hitze ca. 1–1,5 Stunden schmoren. Zum Schluss sollte die Soße noch mit kalter Butter oder Saucenbinder angedickt werden. Tipp: Dazu passen hervorragend Kartoffelklöße, böhmische Knödel oder selbst gemachte Spätzle und natürlich Rotkraut und Salat.  Hinweis: Ich persönlich koche es immer schon am Vorabend und stelle es über Nacht in den Kühlschrank, da sich die gesamten Aromen hierdurch intensivieren (oftmals sagt man ja, dass das Essen am nächsten Tag viel besser schmeckt). Am nächsten Tag nochmals aufkochen und ggf. nachwürzen. Ich empfehle Rindergulasch zu verwenden, da es butterzart wird, je länger man es kocht.","url":"https://www.chefkoch.de/rezepte/2275401363075693/Rindergulasch.html#step1"}]}],"recipeIngredient":["15 g Butterschmalz","500 g Rindergulasch","2 große Zwiebel(n) (gewürfelte)","1 Knoblauchzehe(n) (gehackte)","2 Karotte(n) (in Scheiben geschnitten)","2 EL Tomatenmark","200 ml Rotwein","200 ml Rinderbrühe","300 ml Gemüsebrühe","Salz und Pfeffer","Paprikapulver","etwas Saucenbinder (oder kalte Butter)"],"nutrition":{"@type":"NutritionInformation","servingSize":"1 Portion","calories":"305 kcal","proteinContent":"29 g","fatContent":"11 g","carbohydrateContent":"15 g"},"aggregateRating":{"@type":"AggregateRating","worstRating":0,"bestRating":5,"ratingCount":306,"ratingValue":4.8},"commentCount":153,"interactionStatistic":[{"@type":"InteractionCounter","interactionType":{"@type":"CommentAction"},"userInteractionCount":153}],"comment":[{"@type":"Comment","text":"Klares Rezept ohne Firlefanz.","datePublished":"2026-09-05","author":{"@type":"Person","@id":"https://www.chefkoch.de/user/profil/cc5f4347b5faf9df988109a92a7e1bd9#author","name":"klingonhugdungeons"}},{"@type":"Comment","text":"Hier noch ein Tipp für euch das Fleisch sollte mindestens eine halbe Stunde vorher aus dem Kühlschrank es muss Zimmertemperatur haben! Dann das Fleisch anbraten fleisch wieder aus dem bräter entnehmen und dann die Zwiebeln anbraten und etwas karamellisieren... Dann mit rotwein ablöschen und einköcheln lassen.. Dann das fleisch wieder in den bräter und mit brühe ablöschen dann schmoren lassen!","datePublished":"2025-08-31","author":{"@type":"Person","@id":"https://www.chefkoch.de/user/profil/3dd934ebf6cf988d37d594b6bd9dc6fa#author","name":"Foodfan-reginchen"},"upvoteCount":17},{"@type":"Comment","text":"Hallo!\nIch weiß gar nicht mehr, wie oft ich dieses Gulasch schon gekocht habe, mal mit oder mal ohne Rotwein, dann mehr Brühe. Manchmal lass ich die Möhren weg (wenn ich vergessen habe, welche zu kaufen) manchmal kommt ein Lorbeerblatt mit rein. Meistens gibt es Klöße dazu, gelegentlich Kartoffelpüree, manchmal Nudeln. Als Rest zur Arbeit mitgenommen auch schon mal nur ein Brötchen oder eine Scheibe Weißbrot dazu... immer wieder sehr lecker 😋. Dieses Rezept hat einen festen Platz in unserem Speiseplan. Schmeckt auch meinem Papa (86 Jahre alt) sehr gut! Vielen Dank für das Rezept!!!","datePublished":"2024-11-24","author":{"@type":"Person","@id":"https://www.chefkoch.de/user/profil/5dfab5b31cdf92364d72537a2e664a84#author","name":"remiso"},"upvoteCount":10}],"hasPart":{"@id":"https://www.chefkoch.de/rezepte/2275401363075693/Rindergulasch.html#redaktionstipps"}},{"@type":"WebPage","@id":"https://www.chefkoch.de/rezepte/2275401363075693/Rindergulasch.html","url":"https://www.chefkoch.de/rezepte/2275401363075693/Rindergulasch.html","name":"Rindergulasch, klassisch – saftig und zart","description":"Klassisches Rindergulasch Rezept – Saftiges Gulasch wie bei Oma einfach nachgemacht. Eines der beliebtesten Rezepte entdecken!","isPartOf":{"@id":"https://www.chefkoch.de/#website"},"primaryImageOfPage":{"@id":"https://www.chefkoch.de/rezepte/2275401363075693/Rindergulasch.html#primaryimage"},"breadcrumb":{"@id":"https://www.chefkoch.de/rezepte/2275401363075693/Rindergulasch.html#breadcrumb"},"author":{"@id":"https://www.chefkoch.de/user/profil/6fae2dd1184b83b33b59418840399495#author"},"publisher":{"@id":"https://www.chefkoch.de/#organization"},"reviewedBy":{"@id":"https://www.chefkoch.de/user/profil/fb2becd9d76c4c5edf8393cf7620e1c8#author"},"mainEntity":{"@id":"https://www.chefkoch.de/rezepte/2275401363075693/Rindergulasch.html#recipe"},"inLanguage":"de-DE","datePublished":"2013-03-12","dateModified":"2026-09-06"},{"@type":"ImageObject","@id":"https://www.chefkoch.de/rezepte/2275401363075693/Rindergulasch.html#primaryimage","url":"https://img.chefkoch-cdn.de/rezepte/2275401363075693/bilder/1623585/crop-960x540/rindergulasch.jpg","contentUrl":"https://img.chefkoch-cdn.de/rezepte/2275401363075693/bilder/1623585/crop-960x540/rindergulasch.jpg","width":960,"height":540},{"@type":"BreadcrumbList","@id":"https://www.chefkoch.de/rezepte/2275401363075693/Rindergulasch.html#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"name":"Startseite","item":"https://www.chefkoch.de/"},{"@type":"ListItem","position":2,"name":"Rezepte","item":"https://www.chefkoch.de/rezepte/"},{"@type":"ListItem","position":3,"name":"Menüart","item":"https://www.chefkoch.de/rs/s0g1/Menueart.html"},{"@type":"ListItem","position":4,"name":"Hauptspeise","item":"https://www.chefkoch.de/rs/s0t21/Hauptspeise-Rezepte.html"},{"@type":"ListItem","position":5,"name":"Rind","item":"https://www.chefkoch.de/rs/s0t21,22/Hauptspeise-Rind-Rezepte.html"}]},{"@type":"CreativeWork","@id":"https://www.chefkoch.de/rezepte/2275401363075693/Rindergulasch.html#redaktionstipps","name":"Tipps der Redaktion","author":{"@id":"https://www.chefkoch.de/user/profil/fb2becd9d76c4c5edf8393cf7620e1c8#author"},"hasPart":[{"@type":"HowToTip","name":"Entscheidender Kniff","text":"Das sorgfältige Anbraten am Anfang: Beim Anbraten von Fleisch, Gemüse und Tomatenmark, entsteht die aromatische Basis der Sauce. Beim kräftigen Anbraten der Gulaschstücke entwickeln sich Röstaromen, Zwiebeln und Möhren bekommen eine Süße beim Braten bei mittlerer Hitze und auch das Anbraten von Tomatenmark sorgt für eine süßlich-würzige Grundlagen. Wer mag, lässt den Rotwein etwas offen einkochen, bevor die Brühen dazukommen. Das intensiviert ebenfalls den Geschmack."},{"@type":"HowToTip","name":"Mögliche Stolperfalle","text":"Eine zu kurze Schmorzeit: Das kann dazu führen, dass das Fleisch noch nicht zart ist und die Sauce noch nicht die gewünschte Intensität hat. Also wie im Rezept angegeben bis zu 1,5 Stunden bei geringer Hitze schmoren lassen. Zwischendurch mal umrühren und vor Ende der Garzeit ein Stückchen Fleisch mit Sauce probieren. Es soll zart, mürbe und würzig schmecken."},{"@type":"HowToTip","name":"So sieht's richtig gut aus","text":"In einer dunkelbraunen glänzenden Sauce liegen die dunkelbraunen, saftigen Rindfleischstücke und die orangenen Möhrenscheiben. Das heiße Gulasch duftet würzig und macht richtig Appetit."}]},{"@type":"WebSite","@id":"https://www.chefkoch.de/#website","url":"https://www.chefkoch.de/","name":"Chefkoch","inLanguage":"de-DE","publisher":{"@id":"https://www.chefkoch.de/#organization"}},{"@type":"Organization","@id":"https://www.chefkoch.de/#organization","name":"Chefkoch","url":"https://www.chefkoch.de/","logo":{"@type":"ImageObject","url":"https://img.chefkoch-cdn.de/img/ck.de/ck-logo-de.png","width":144,"height":144},"sameAs":["https://www.facebook.com/chefkoch.de","https://www.instagram.com/chefkoch/","https://www.youtube.com/chefkoch","https://de.pinterest.com/chefkochde/","https://www.tiktok.com/@chefkoch","https://www.whatsapp.com/channel/0029VabvqZU3LdQOknGWyl1H"]},{"@type":"Person","@id":"https://www.chefkoch.de/user/profil/6fae2dd1184b83b33b59418840399495#author","name":"foreigner1986","url":"https://www.chefkoch.de/user/profil/6fae2dd1184b83b33b59418840399495"},{"@type":"Person","@id":"https://www.chefkoch.de/user/profil/fb2becd9d76c4c5edf8393cf7620e1c8#author","name":"Chefkoch_InaLa","url":"https://www.chefkoch.de/user/profil/fb2be
